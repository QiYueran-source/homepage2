version: '3.8'

services:
  homepage:
    build: .
    ports:
      - "${SERVER_PORT}:83"
    restart: unless-stopped
    volumes:
      # 挂载数据目录，只读即可
      - ./data:/app/data:ro
      # 挂载生成的 html 目录，持久化并便于调试
      - ./html:/app/html
    environment:
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:83/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
