<!-- 文档预览区域 -->
<section id="docs" class="py-28 px-4 md:px-8 bg-apple-lightgray">
    <div class="container mx-auto max-w-5xl">
        <div class="text-center">
            <h2 class="text-3xl md:text-4xl font-bold mb-4 text-center reveal-element">
                {{ title }}
            </h2>
            <p class="text-apple-gray text-center mb-12 reveal-element" data-sr-delay="100">
                {{ subtitle }}
            </p>

            <!-- 跳转按钮 -->
            <div class="reveal-element" data-sr-delay="200">
                <a href="{{ docs_url }}" class="inline-flex items-center bg-blue-600 text-white px-8 py-4 rounded-full text-lg hover:bg-blue-700 transition-all transform hover:scale-105 shadow-lg hover:shadow-xl">
                    <i class="fa-solid fa-folder-open mr-3"></i>
                    浏览文档
                    <i class="fa-solid fa-arrow-right ml-3"></i>
                </a>
            </div>
        </div>
    </div>
</section>
